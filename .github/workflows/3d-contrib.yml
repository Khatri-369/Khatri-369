name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate 3D contribution graph
        run: |
          mkdir -p profile-3d-contrib
          cd profile-3d-contrib
          npm init -y
          npm install github-3d-contrib

      - name: Run 3D contribution generator
        run: |
          cd profile-3d-contrib
          npx github-3d-contrib Khatri-369
          ls -la

      - name: Commit & Push
        run: |
          if [ -d "profile-3d-contrib" ] && [ "$(ls -A profile-3d-contrib)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile-3d-contrib/
            git commit -m "Generate 3D contribution graph" || echo "No changes to commit"
            git push
          else
            echo "3D contribution files not generated"
          fi
